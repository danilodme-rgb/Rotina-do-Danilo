name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permissões mínimas para publicar o site
permissions:
  contents: read
  pages: write
  id-token: write

# Uma publicação por vez, sem cancelar a que já está rodando
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Publicar arquivo quebrado e' publicar com sucesso: o Pages nao olha o que
  # esta dentro. Esta trava e' o que impede o app de ir ao ar com a tela branca.
  conferir:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4
      - name: Preparar o Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Conferir o app (com autoteste da própria conferência)
        run: node scripts/conferir.mjs --autoteste

  publicar:
    needs: conferir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Preparar o Pages
        uses: actions/configure-pages@v5
        with:
          # liga o Pages na primeira execução, se ainda estiver desligado
          enablement: true

      - name: Empacotar o site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Publicar
        id: publicacao
        uses: actions/deploy-pages@v4
