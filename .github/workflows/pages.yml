name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permissões mínimas para publicar o site
permissions:
  contents: read
  pages: write
  id-token: write

# Uma publicação por vez, sem cancelar a que já está rodando
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Preparar o Pages
        uses: actions/configure-pages@v5
        with:
          # liga o Pages na primeira execução, se ainda estiver desligado
          enablement: true

      - name: Carimbar a versão publicada
        run: |
          versao="${GITHUB_SHA::7}"
          publicado="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          printf '{"versao":"%s","publicado":"%s"}\n' "$versao" "$publicado" > versao.json
          sed -i "s|export const VERSAO = 'dev';|export const VERSAO = '$versao';|" js/versao.js
          sed -i "s|export const PUBLICADO = '';|export const PUBLICADO = '$publicado';|" js/versao.js
          echo "Publicando versão $versao ($publicado)"
          cat versao.json
          grep 'export const' js/versao.js

      - name: Empacotar o site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Publicar
        id: publicacao
        uses: actions/deploy-pages@v4
